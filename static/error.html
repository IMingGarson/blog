<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timmy Captial</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC",
          sans-serif;
        background-color: #f5f5f7;
        color: #1d1d1f;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .alert-box {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 18px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
      }

      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        color: #b25000;
        background: rgba(255, 149, 0, 0.14);
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.015em;
        margin-bottom: 8px;
      }

      p {
        font-size: 14px;
        color: #6e6e73;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 20px;
        border-radius: 10px;
        background: #0071e3;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }

      a:hover {
        background: #0077ed;
      }
    </style>
  </head>
  <body>
    <div class="alert-box" role="alert">
      <div class="badge">系統警告</div>
      <h1>暫時無法提供服務</h1>
      <p>系統目前發生異常或忙碌中，請稍後再試。</p>
    </div>
  </body>
</html>
