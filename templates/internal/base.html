<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Console - Timmy Blog</title>
    <style>
      /* 基礎重置與變數 */
      :root {
        --bg-color: #f5f5f7;
        --card-bg: #ffffff;
        --text-main: #1d1d1f;
        --text-muted: #86868b;
        --border-color: #e5e5ea;
        --accent-blue: #0066cc;
        --accent-blue-hover: #0077ed;
        --hover-bg: #f5f5f7;
        --font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* 左側導覽列 (Sidebar) */
      .sidebar {
        width: 260px;
        background-color: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        z-index: 10;
      }

      .sidebar-header {
        padding: 30px 24px;
      }

      .sidebar-header h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.5px;
        color: var(--text-main);
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        padding: 0 16px;
        gap: 8px;
      }

      .nav-item {
        text-decoration: none;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 500;
        color: var(--text-muted);
        transition: all 0.2s ease;
      }

      .nav-item:hover {
        background-color: var(--hover-bg);
        color: var(--text-main);
      }

      .nav-item.active {
        background-color: #e8f2fc;
        color: var(--accent-blue);
      }

      /* 右側主內容區 */
      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .main-content {
        padding: 40px;
        width: 100%;
        max-width: 1200px; /* 限制最大寬度，確保大螢幕閱讀舒適 */
        margin: 0 auto;
      }

      /* 共用卡片樣式 (給內容裝載用) */
      .content-card {
        background-color: var(--card-bg);
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.05),
          0 2px 4px -1px rgba(0, 0, 0, 0.03);
        padding: 40px;
        min-height: calc(100vh - 80px);
      }

      /* 隱藏捲軸但保留滾動功能 (視覺更乾淨) */
      .main-wrapper::-webkit-scrollbar {
        display: none;
      }
      .main-wrapper {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <!-- 固定的側邊欄 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Admin Console</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/internal" class="nav-item {% if '/internal' in request.path and 'users' not in request.path %}active{%endif%}">文章管理</a>
        <a href="/internal/users" class="nav-item {% if '/internal/users' in request.path %}active{%endif%}">會員管理</a>
      </nav>
    </aside>

    <!-- 右側內容區 -->
    <div class="main-wrapper">
      <main class="main-content">
        <div class="content-card">{% block content %} {% endblock %}</div>
      </main>
    </div>
  </body>
</html>
