<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入 - Timmy Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div
      class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 w-full max-w-md"
    >
      <!-- 標題區 -->
      <div class="text-center mb-8">
        <h1 class="text-2xl font-semibold text-gray-900">登入</h1>
        <p class="text-gray-500 mt-2 text-sm">歡迎回到 Timmy Blog</p>
      </div>

      <!-- 登入表單 -->
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label
          >
          <input
            type="email"
            id="login-email"
            required
            class="w-full px-4 py-3 rounded-xl bg-gray-50 border-transparent focus:border-blue-500 focus:bg-white focus:ring-0 transition-colors"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >密碼</label
          >
          <input
            type="password"
            id="login-password"
            required
            class="w-full px-4 py-3 rounded-xl bg-gray-50 border-transparent focus:border-blue-500 focus:bg-white focus:ring-0 transition-colors"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-black text-white rounded-xl py-3 font-medium hover:bg-gray-800 transition-colors mt-4"
        >
          登入
        </button>
        <div class="text-center mt-4">
          <a href="/signup" class="text-sm text-blue-600 hover:underline"
            >還沒有帳號？點此註冊</a
          >
        </div>
      </form>

      <!-- 錯誤訊息提示區 -->
      <div
        id="error-message"
        class="text-red-500 text-sm mt-4 text-center hidden"
      ></div>
    </div>

    <script>
      // 取得 Django CSRF Token 的標準函式
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(
                cookie.substring(name.length + 1),
              );
              break;
            }
          }
        }
        return cookieValue;
      }

      const csrftoken = getCookie("csrftoken");
      const errorDiv = document.getElementById("error-message");

      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          errorDiv.classList.add("hidden");

          const btn = e.target.querySelector("button");
          btn.disabled = true;
          btn.innerText = "登入中...";

          const payload = {
            email: document.getElementById("login-email").value,
            password: document.getElementById("login-password").value,
          };

          try {
            // 呼叫登入 API
            const res = await fetch("/api/users/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrftoken,
              },
              body: JSON.stringify(payload),
            });

            const data = await res.json();

            if (res.ok) {
              // 登入成功，導向首頁 (文章列表)
              window.location.href = "/";
            } else {
              // API 回傳 401 或 403 (包含雙重驗證未完成的提示)
              throw new Error(data.error || "登入失敗，請檢查帳號密碼。");
            }
          } catch (err) {
            errorDiv.innerText = "登入資料有誤，請通知管理員";
            errorDiv.classList.remove("hidden");
            btn.disabled = false;
            btn.innerText = "登入";
          }
        });
    </script>
  </body>
</html>
