services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      TZ: Asia/Taipei
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network

  memcached:
    build:
      context: .
      dockerfile: Dockerfile.memcached
    container_name: memcached_container
    restart: always
    ports:
      - "127.0.0.1:11211:11211"
    environment:
      MEMCACHED_USER: ${MEMCACHED_USER}
      MEMCACHED_PASSWORD: ${MEMCACHED_PASSWORD}
    command: >
      sh -c "
      echo \"$$MEMCACHED_PASSWORD\" | saslpasswd2 -p -c -f /etc/sasl2/memcached-sasldb2 -u memcached \"$$MEMCACHED_USER\" &&
      chown memcache:memcache /etc/sasl2/memcached-sasldb2 &&
      exec memcached -S -m 1024 -c 2048 -t 4 -I 5m -u memcache
      "
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 1024M
    healthcheck:
      test: echo stats | nc localhost 11211
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_container
    restart: always
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/ubuntu/blog/staticfiles:/home/ubuntu/blog/staticfiles:ro
    networks:
      - app-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  app-network:
    driver: bridge
